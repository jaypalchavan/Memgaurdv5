<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemGuard v5 — Project README & Architectural Blueprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-subtle: rgba(56, 189, 248, 0.18);
            --border-glow: rgba(56, 189, 248, 0.4);
            --accent-cyan: #00f2fe;
            --accent-blue: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.68;
            padding: 2rem 1.5rem;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 3rem 3.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .container { padding: 1.5rem; }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .badge-live {
            background: rgba(0, 242, 254, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
            color: white;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
        }

        /* Typography & Markdown Styles */
        h1, h2, h3, h4, h5, h6 {
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 0.75rem;
        }

        h2 {
            font-size: 1.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.5rem;
        }

        h3 { font-size: 1.25rem; color: var(--accent-blue); }
        h4 { font-size: 1.05rem; }

        p { margin-bottom: 1.2rem; color: #cbd5e1; font-size: 1rem; }
        ul, ol { margin-bottom: 1.2rem; padding-left: 1.75rem; color: #cbd5e1; }
        li { margin-bottom: 0.4rem; }

        a { color: var(--accent-blue); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent-cyan); text-decoration: underline; }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
            margin: 2.5rem 0;
        }

        code:not(pre code) {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(15, 23, 42, 0.8);
            color: #a5f3fc;
            padding: 0.2rem 0.45rem;
            border-radius: 4px;
            font-size: 0.88em;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        pre {
            background: #050811 !important;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 1.25rem;
            margin: 1.5rem 0;
            overflow-x: auto;
        }

        pre code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        blockquote {
            border-left: 4px solid var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            color: #94a3b8;
            font-style: italic;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.9rem;
            background: rgba(10, 15, 30, 0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        th {
            background: rgba(15, 23, 42, 0.9);
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        tr:hover td {
            background: rgba(56, 189, 248, 0.04);
        }

        .mermaid {
            background: rgba(5, 8, 17, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.75rem 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="action-bar">
            <div>
                <span class="badge-live">● README.md Rendered Preview</span>
                <span style="font-size: 0.85rem; color: var(--text-secondary); margin-left: 0.75rem;">
                    MemGuard v5.2.0-SOC-Enterprise
                </span>
            </div>
            <div class="btn-group">
                <a href="http://localhost:8000" class="btn btn-primary" target="_blank">
                    🛡️ Launch SOC Dashboard
                </a>
                <a href="http://localhost:8000/architecture" class="btn" target="_blank">
                    🏛️ Interactive Architecture
                </a>
                <button class="btn" onclick="window.print()">
                    🖨️ Print / Save PDF
                </button>
            </div>
        </div>

        <div id="content">Loading documentation...</div>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                background: '#050811',
                primaryColor: '#0284c7',
                primaryTextColor: '#f8fafc',
                primaryBorderColor: '#38bdf8',
                lineColor: '#00f2fe',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            }
        });

        async function loadReadme() {
            try {
                // Fetch the actual README.md file
                const response = await fetch('README.md');
                let markdown = '';
                if (response.ok) {
                    markdown = await response.text();
                } else {
                    markdown = "# Error\\nCould not load README.md directly via HTTP.";
                }

                marked.setOptions({
                    highlight: function(code, lang) {
                        if (hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });

                // Custom renderer for Mermaid blocks
                const renderer = new marked.Renderer();
                const defaultCodeRenderer = renderer.code.bind(renderer);
                renderer.code = function(code, lang, escaped) {
                    if (lang === 'mermaid') {
                        return '<div class="mermaid">' + code + '</div>';
                    }
                    return defaultCodeRenderer(code, lang, escaped);
                };

                document.getElementById('content').innerHTML = marked.parse(markdown, { renderer: renderer });

                // Render Mermaid diagrams
                setTimeout(async () => {
                    await mermaid.run();
                }, 100);

            } catch (err) {
                console.error(err);
                document.getElementById('content').innerHTML = "<p style='color: #ef4444;'>Failed to render: " + err.message + "</p>";
            }
        }

        window.addEventListener('DOMContentLoaded', loadReadme);
    </script>
</body>
</html>
